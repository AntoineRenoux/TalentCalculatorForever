# Déployé sur le VPS dans /opt/talentcalculator.
# Aucun port publié : le Caddy partagé (/opt/infra/proxy) sert le site via le réseau "proxy",
# avec deploy/talentcalculator.caddy copié dans /opt/infra/proxy/sites/.
name: talentcalculator

services:
  web:
    build: .
    restart: unless-stopped
    networks:
      proxy:
        aliases: [talentcalculator-web]

  # Armurerie : appelle l'API Blizzard avec le client défini dans .env (jamais commité).
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file: .env
    networks:
      proxy:
        aliases: [talentcalculator-api]

networks:
  proxy:
    name: proxy
    external: true
